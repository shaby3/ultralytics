# KD config — Detect head 2번째 conv 에서 증류. teacher = yolov8s COCO-pretrained. 기법 = FGD.
#
# Phase 3(KD 기법 비교) 4수준 중 하나. distill_head1_from_8s_coco.yaml 에서
# aligner·loss·weight 만 다르고 teacher·layers 는 같다.
#
# FGD (https://arxiv.org/abs/2111.11837) = Focal + Global.
# Focal: GT box 를 feature 에 투영한 전경/배경 마스크와 teacher 의 attention(파라미터 없음)으로
#   전경·배경을 분리해 MSE + attention 맞춤 L1. Global: GcBlock(학습 파라미터, student·teacher 각 1벌)이
#   전역 문맥을 더한 뒤 MSE. 구현은 ultralytics/utils/loss.py 의 FGDLoss (레퍼런스
#   https://github.com/yzd-v/FGD 의 FeatureLoss 를 mmcv 의존만 제거하고 수식 그대로 포팅 — 동일
#   가중치·입력에서 diff 0 확인).
#
# 다른 기법과 구조가 다른 점 둘:
# 1. aligner 가 IdentityAligner 다 — FGD 레퍼런스가 채널이 다를 때만 내부 1x1 투영을 만들기 때문에
#    aligner 슬롯에서 또 정렬하면 FGD 가 아니게 된다. 여기 6지점에서는 cls(64->128) 3지점에만 생긴다.
# 2. loss 에 학습 파라미터가 있다 (6지점 합계 151,884개 = ConvBNSiLUAligner 의 1.51배) —
#    DistillationWrapper 에 등록되어 aligner 와 같은 경로로 학습된다.
#
# loss_args 는 논문 기본값 그대로다. 내부 4항은 레퍼런스의 sum 기반 reduction 을 그대로 두는데,
# 이는 "reduction 전부 mean" 관례(README §4)의 의도적 예외다 — 4항의 이질적 reduction 을 mean 으로
# 바꾸면 논문이 튜닝한 항간 비율이 근거 없이 뒤틀린다. 총량 스케일만 아래 weight 로 맞춘다.
#
# 해석 주의 (README §4):
# 1. off-label — FGD 는 넥(FPN) feature 전용으로 설계·검증된 기법이고 head 중간 특징에 대한 논문
#    근거가 없다. 기법 축을 유지하기 위한 의도적 선택이다.
# 2. MSE·PKD 런 대비 정렬부·attention 가중·GcBlock 이 함께 바뀐다 (MGD 와 같은 부류의 다축 변화).
# 3. GT box 를 쓰는 유일한 기법이라 feature 만 보는 나머지 3수준과 입력 정보량 자체가 다르다.

teacher:
  # COCO-pretrained 체크포인트 (repo 루트). 기법 4수준이 전부 이 teacher 로 고정된다.
  model: yolov8s.pt
  layers:
    - "model.22.cv2.0.1" # box P3/8
    - "model.22.cv2.1.1" # box P4/16
    - "model.22.cv2.2.1" # box P5/32
    - "model.22.cv3.0.1" # cls P3/8
    - "model.22.cv3.1.1" # cls P4/16
    - "model.22.cv3.2.1" # cls P5/32

student:
  layers:
    - "model.22.cv2.0.1"
    - "model.22.cv2.1.1"
    - "model.22.cv2.2.1"
    - "model.22.cv3.0.1"
    - "model.22.cv3.1.1"
    - "model.22.cv3.2.1"

aligner: IdentityAligner # 통과만 한다 — 채널 정렬은 FGD 가 내부에서 (위 주석 1번)
loss: fgd
loss_args: # 논문 기본값 (mmdet 레퍼런스의 __init__ 기본값과 동일)
  temp: 0.5 # attention softmax 온도
  alpha_fgd: 0.001 # 전경 loss
  beta_fgd: 0.0005 # 배경 loss
  gamma_fgd: 0.001 # attention 마스크 L1
  lambda_fgd: 0.000005 # global 관계 loss
# 1에폭 프로브 실측 (scripts/voc/probe_kd_scale.json): FGD 는 sum reduction 이라 kd_loss 가 117.5 로
# task(4.55)의 26배다. 다른 기법과 달리 두 번 쟀다 — w=1.0 프로브(fgd_w1p0)에서는 KD 비중이 95% 가
# 되어 task_loss 까지 오염됐고(6.15), 보정 추정치 0.046 으로 재프로브한 정상 조건 측정에서
# 1.1552 x 4.8522 / 117.53 = 0.0477 -> 0.048 (반올림). 보정 후 초기 KD 비중 53.8% (MSE 53.6%).
weight: 0.048
