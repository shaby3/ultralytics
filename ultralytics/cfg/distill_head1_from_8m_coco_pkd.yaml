# KD config — Detect head 2번째 conv 에서 증류. teacher = **yolov8m** COCO-pretrained. loss = PKD.
#
# teacher 크기 축(Q3)의 두 번째 런. distill_head1_from_8s_coco_pkd.yaml 에서
# **teacher.model 한 줄만** 다르다 — 위치·loss·aligner 가 같아 teacher 크기(s->m)만 분리된다.
#
# 같은 축을 기법 2종으로 도는 이유: m-COCO x QMSE 가 s-COCO x QMSE 에 ~0.6pt 뒤지는 궤적이라
# (capacity gap 신호), "m 이 나쁜 것"인지 "QMSE x m 조합이 나쁜 것"인지 갈라야 한다.
# PKD 로도 m 이 s 에 뒤지면 **기법과 무관한 teacher 크기 효과**로 굳고, PKD 에서는 m 이 이기면
# 기법 x teacher 크기 교호작용이 있다는 뜻이 된다.
#
# 비교 4점: s x QMSE(0.6564) / s x PKD(0.6533) / m x QMSE(진행 중) / m x PKD(이 런).
#
# PKD 는 채널별 표준화 후 MSE = 1 - Pearson r 이라 스케일에 무관하다. teacher 를 키워도
# kd_loss 가 1 부근에 갇히므로 weight 가 s 기준(8.0)에서 크게 움직이지 않을 것으로 예상되지만,
# 관례대로 프로브로 확정한다. 증류 지점 채널: box 64 / cls 192 (s 는 128) — cls aligner 만 커진다.

teacher:
  # COCO-pretrained 체크포인트 (repo 루트)
  model: yolov8m.pt
  layers:
    - "model.22.cv2.0.1" # box P3/8
    - "model.22.cv2.1.1" # box P4/16
    - "model.22.cv2.2.1" # box P5/32
    - "model.22.cv3.0.1" # cls P3/8
    - "model.22.cv3.1.1" # cls P4/16
    - "model.22.cv3.2.1" # cls P5/32

student:
  layers:
    - "model.22.cv2.0.1"
    - "model.22.cv2.1.1"
    - "model.22.cv2.2.1"
    - "model.22.cv3.0.1"
    - "model.22.cv3.1.1"
    - "model.22.cv3.2.1"

aligner: ConvBNSiLUAligner # s-COCO PKD 런과 동일하게 고정 — teacher 크기 하나만 갈린다
loss: pkd
# 1에폭 프로브 실측 (scripts/voc/probe_kd_scale.json 의 pkd_8m): kd_loss 원값 0.5775 —
# s-PKD(0.6476)보다 낮다. PKD 는 1 - r 이라 이건 **student 가 m 의 채널 패턴을 s 보다 더 잘
# 따라간다**는 뜻이다 (ep1·AdamW 기준). 패턴 추종은 더 쉬운데 최종 mAP 는 m 이 뒤지는지
# (m x QMSE 가 -0.47pt 였다) 이 런이 답한다.
# KD 비중 11.1% < 재프로브 기준(80%): 1.1552 x 4.6150 / 0.5775 = 9.2312 -> 9.0 (반올림,
# s-PKD 의 8.124 -> 8.0 과 같은 방식). 보정 후 초기 KD 비중 53.0% (MSE 53.6%).
weight: 9.0
