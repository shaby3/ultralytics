# Knowledge Distillation config for Pruned GC10-DET (yolo26m teacher → pruned yolo26n student)
# KD fine-tune after magnitude pruning. Teacher는 변환된 yolo26m baseline best.pt 사용.
# Unified 12-point: one2many(cv2/cv3) + one2one(one2one_cv2/cv3)

teacher:
  model: runs/detect/gc10_det/train/baseline_yolo26m_gc10_det_200epoch/weights/best_converted.pt
  layers:
    # one2many branch
    - "model.23.cv2.0.1"
    - "model.23.cv2.1.1"
    - "model.23.cv2.2.1"
    - "model.23.cv3.0.1"
    - "model.23.cv3.1.1"
    - "model.23.cv3.2.1"
    # one2one branch
    - "model.23.one2one_cv2.0.1"
    - "model.23.one2one_cv2.1.1"
    - "model.23.one2one_cv2.2.1"
    - "model.23.one2one_cv3.0.1"
    - "model.23.one2one_cv3.1.1"
    - "model.23.one2one_cv3.2.1"

student:
  layers:
    # one2many branch
    - "model.23.cv2.0.1"
    - "model.23.cv2.1.1"
    - "model.23.cv2.2.1"
    - "model.23.cv3.0.1"
    - "model.23.cv3.1.1"
    - "model.23.cv3.2.1"
    # one2one branch
    - "model.23.one2one_cv2.0.1"
    - "model.23.one2one_cv2.1.1"
    - "model.23.one2one_cv2.2.1"
    - "model.23.one2one_cv3.0.1"
    - "model.23.one2one_cv3.1.1"
    - "model.23.one2one_cv3.2.1"

aligner: ConvBNSiLUAligner
loss: mse
weight: 1.0
