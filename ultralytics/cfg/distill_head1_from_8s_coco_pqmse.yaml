# KD config — Detect head 2번째 conv 에서 증류. teacher = yolov8s COCO-pretrained. loss = PQMSE.
#
# QMSE(기법 축 선두, 0.6564) 후속 변형. distill_head1_from_8s_coco_qmse.yaml 과 비교해
# 마스크 구성 두 축이 갈린다:
# ① 분기별 성분 마스크(box<-IoU, cls<-score) -> **쌍 단위 결합 마스크, 6지점 공통**
# ② score 가 클래스 max -> **GT 클래스의 score** (PGD·TAL 과 같은 쌍 정합)
#
#   t(위치, GT) = score_GT클래스(위치)^0.5 x IoU(위치 예측박스, GT)^2
#   mask(위치)  = max over GT [ t(위치, GT) ]
#
# 지수 0.5/2 는 사용자 결정이다 — PGD 원본의 s^(1-a)·IoU^a 보간과 다르다. PGD 에서 차용한 건
# "쌍 결합 품질 점수" 형태고, top-k 선발·2D 가우시안·fg/bg·attention 은 없다 (전 픽셀 soft 가중,
# QMSE 골격). IoU 는 일반 IoU — PGD 의 BboxOverlaps2D 기본값 그대로 (TAL 의 CIoU 와 다름).
#
# teacher 가 COCO(nc=80)라 VOC 라벨(0~19)로 score 채널을 직접 인덱싱하면 엉뚱한 클래스를
# 잡는다 (person = VOC 14 vs COCO 0). PQMSEFeatureLoss.VOC_TO_COCO 매핑 20개가 변환하며,
# 이름 문자열 자동 대조로 검증했다.
#
# 집중도 실측 (VOC 16장, 정규화 후): 유효 참여율 7~22% — QMSE 의 score 마스크(4~8%)보다
# 완화되고 IoU 마스크(44~56%)보다 집중적인 중간 지점. 배경은 사실상 배제된다 (w<0.1 이 61~81%).

teacher:
  # COCO-pretrained 체크포인트 (repo 루트). 기법 비교는 전부 이 teacher 로 고정된다.
  model: yolov8s.pt
  layers:
    - "model.22.cv2.0.1" # box P3/8
    - "model.22.cv2.1.1" # box P4/16
    - "model.22.cv2.2.1" # box P5/32
    - "model.22.cv3.0.1" # cls P3/8
    - "model.22.cv3.1.1" # cls P4/16
    - "model.22.cv3.2.1" # cls P5/32

student:
  layers:
    - "model.22.cv2.0.1"
    - "model.22.cv2.1.1"
    - "model.22.cv2.2.1"
    - "model.22.cv3.0.1"
    - "model.22.cv3.1.1"
    - "model.22.cv3.2.1"

aligner: ConvBNSiLUAligner # 기법 스윕과 동일하게 고정 — 마스크 구성만 갈린다
loss: pqmse
# 1에폭 프로브 실측 (scripts/voc/probe_kd_scale.json): kd_loss 원값 10.50 — qmse(9.54)와 비슷한
# 자릿수다. w=1.0 프로브 KD 비중 68.4% 는 재프로브 기준(80%) 미만이라 한 번에 확정.
# 공식 산출 1.1552 x 4.8417 / 10.4985 = 0.5328, 채택값 0.5 (사용자 결정, -6.2% — 기존 반올림 폭
# 18.8->20=6% 경계). 보정 후 초기 KD 비중 52.0% (MSE 53.6%).
weight: 0.5
