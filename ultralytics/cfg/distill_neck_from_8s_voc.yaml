# KD config — neck 출력(P3/P4/P5)에서 증류. teacher = yolov8s VOC 학습본.
#
# Q2(증류 위치) 비교용 3종 중 하나. distill_head0_/distill_head1_from_8s_voc.yaml 과
# teacher·aligner·loss·weight 가 모두 같고 layers 만 다르다. 비교를 위해 이 대응을 깨지 말 것.
#
# 증류 지점: neck 출력 3 지점 (layer 15/18/21 = C2f, Detect 의 입력)
# 채널 (student n → teacher s): P3 64→128, P4 128→256, P5 256→512
#   → head(6지점, 64→64·64→128)보다 aligner 가 훨씬 크다. neck 이 이기면 "위치 효과"인지
#     "aligner 용량 효과"인지 해석에 단서를 달아야 한다.
# C2f 는 마지막이 cv2 = Conv 이므로 neck 출력도 Conv(Conv2d+BN+SiLU) 출력이다
#   → head 와 동일한 근거로 ConvBNSiLUAligner 가 맞다.

teacher:
  # repo 루트에서 실행하는 것을 전제로 한 상대경로 (README §4)
  model: runs/detect/voc/baseline/yolov8s/train/weights/best.pt
  layers:
    - 15 # P3/8
    - 18 # P4/16
    - 21 # P5/32

student:
  layers:
    - 15
    - 18
    - 21

aligner: ConvBNSiLUAligner # README §4 — teacher feature 가 BN+SiLU 출력이므로 고정
loss: mse
weight: 1.0
