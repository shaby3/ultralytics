# KD config — neck 출력(15/18/21)에서 증류. teacher = yolov8s **VOC 학습본**. loss = MSE.
#
# 위치 × teacher 출처 2×2 를 채우는 런. 지금까지 위치 순위(head`.1` > head`.0` > neck)는
# **s-COCO 에서만** 확인됐고, teacher 를 바꿔도 같은 순위인지는 미검증이었다 (README §1 의
# "greedy 탐색의 한계"). 이 런이 그 칸을 메운다:
#
#   |        | s-VOC          | s-COCO |
#   | neck   | **이 런**      | 0.6408 |
#   | head.1 | 0.6342         | 0.6496 |
#
# distill_neck_from_8s_coco.yaml 에서 **teacher.model 한 줄만** 다르고(그리고 프로브로 정한
# weight), distill_head1_from_8s_voc.yaml 과는 **layers 만** 다르다 — 두 방향 모두 한 축 비교다.
#
# 증류 지점은 C2f 출력(넥 3스케일)이라 head 지점과 채널이 다르다: 64/128/256 (s teacher).
# student(n)는 32/64/128 이라 aligner 가 2배 폭으로 정렬한다.

teacher:
  # VOC 파인튜닝 체크포인트 (baseline s 런의 best.pt) — COCO 사전학습본과 대조되는 조건
  model: runs/detect/voc/baseline/yolov8s/train/weights/best.pt
  layers:
    - 15 # P3/8
    - 18 # P4/16
    - 21 # P5/32

student:
  layers:
    - 15
    - 18
    - 21

aligner: ConvBNSiLUAligner # README §4 — teacher feature 가 BN+SiLU 출력이므로 고정
loss: mse
# 1에폭 프로브 실측 (scripts/voc/probe_kd_scale.json 의 neck_voc): kd_loss 원값 0.2283 —
# 넥은 head 지점(5.26)의 1/23 이라 weight 가 커야 KD 비중이 맞는다 (위치 스윕에서 확인한 성질).
# KD 비중 4.7% < 재프로브 기준(80%), 한 번에 확정: 1.1552 x 4.6521 / 0.2283 = 23.54 -> 24
# (유효숫자 2자리 반올림, +2.0%). 보정 후 초기 KD 비중 54.2%.
#
# 주 비교 대상인 head`.1` x s-VOC 런의 KD 비중(54.3%)과 거의 일치한다 — 위치 축이 깨끗하게 갈린다.
# 다만 neck x s-COCO 런은 weight 20.0(비중 45.6%)이라, "넥에서의 teacher 출처 비교"로 읽을 때는
# KD 강도 8.6pt 차이가 교락으로 남는다. 이 런의 목적은 어디까지나 위치 축 재확인이다.
weight: 24.0
