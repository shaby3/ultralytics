# KD config — Detect head 2번째 conv 에서 증류. teacher = yolov8s COCO-pretrained. loss = QMSE.
#
# AMSE(-0.66pt, activation 크기 가중) 후속 ablation. distill_head1_from_8s_coco.yaml 에서
# loss 와 weight 만 다르고 teacher·layers·aligner 는 전부 같다 — MSE 런과 "가중 기준" 한 축 비교.
# 단 마스크 산출에 GT 와 teacher 예측이 들어가므로 feature 만 보는 기법(MSE·PKD)과
# 입력 정보량이 다르다는 단서는 남는다 (README §4).
#
# QMSE = 예측 품질 가중 MSE. branch 별로 마스크가 다르다 (layers 의 cv2/cv3 에서 자동 판별):
# - box 분기(cv2) <- IoU 마스크: 위치별 teacher 디코딩 박스 vs 이미지 내 전체 GT 의 max IoU.
#   배경 위치도 예측 박스가 GT 와 겹치는 만큼 참여한다 (soft 감쇠가 곧 가중치).
# - cls 분기(cv3) <- score 마스크: 위치별 teacher cls sigmoid 의 클래스 max.
#   teacher 가 COCO(nc=80)라 80클래스 기준 확신도다.
# 마스크는 teacher 예측+GT 로만 계산되는 상수(no_grad)고, 지점·이미지별 평균 1 로 정규화해
# mean reduction 관례 안에 있다 — 균등 마스크면 일반 MSE 로 환원. 빈 GT 이미지의 IoU 마스크는
# 균등으로 대체한다. 채널 가중은 없다 (AMSE 에서 one-hot 퇴화가 확인된 축).
#
# PGD(https://arxiv.org/abs/2203.05469)에서 cls/reg 마스크 분리를 차용했지만 이식이 아니다 —
# PGD 는 s^(1-a)·IoU^a 로 GT 별 top-k 위치를 선발해 2D 가우시안을 적합하고 FGD 식
# fg/bg+attention 구조에 얹는다. 여기서는 성분 마스크를 전 픽셀 soft 가중으로 직접 쓴다
# (top-k·가우시안·fg/bg·attention 없음). FGD 의 "박스당 질량 균등"(소형 객체 강조)도 없다 —
# 최소 형태 우선, 보정은 후속 변형.

teacher:
  # COCO-pretrained 체크포인트 (repo 루트). 기법 비교는 전부 이 teacher 로 고정된다.
  model: yolov8s.pt
  layers:
    - "model.22.cv2.0.1" # box P3/8
    - "model.22.cv2.1.1" # box P4/16
    - "model.22.cv2.2.1" # box P5/32
    - "model.22.cv3.0.1" # cls P3/8
    - "model.22.cv3.1.1" # cls P4/16
    - "model.22.cv3.2.1" # cls P5/32

student:
  layers:
    - "model.22.cv2.0.1"
    - "model.22.cv2.1.1"
    - "model.22.cv2.2.1"
    - "model.22.cv3.0.1"
    - "model.22.cv3.1.1"
    - "model.22.cv3.2.1"

aligner: ConvBNSiLUAligner # MSE 런과 동일하게 고정 — 가중 기준 하나만 갈린다
loss: qmse
# 1에폭 프로브 실측 (scripts/voc/probe_kd_scale.json): kd_loss 원값 9.54 — MSE(5.26)의 1.8배로
# AMSE(15배)와 달리 온건하다. 품질 마스크의 질량이 GT 주변에 몰려 있어도 정규화(평균 1) 후
# 오차와의 상관이 크기 가중만큼 극단적이지 않다는 뜻이다. w=1.0 프로브의 KD 비중 66.9%는
# 재프로브 기준(80%) 미만이라 한 번에 확정: 1.1552 x 4.7187 / 9.5403 = 0.5714 -> 0.57.
# 보정 후 초기 KD 비중 53.5% (MSE 53.6%) — AMSE 교훈대로 산출값 그대로 쓴다.
weight: 0.57
