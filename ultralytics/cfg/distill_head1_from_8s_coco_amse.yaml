# KD config — Detect head 2번째 conv 에서 증류. teacher = yolov8s COCO-pretrained. loss = AMSE.
#
# Phase 3(KD 기법 비교)의 후속 ablation. distill_head1_from_8s_coco.yaml 에서
# loss 와 weight 만 다르고 teacher·layers·aligner 는 전부 같다 — MSE 런과 정확히 한 축
# (위치·채널별 균등 가중 -> teacher attention 가중)만 다른 비교다.
#
# AMSE 는 논문의 단독 기법이 아니라 **폐기한 FGD 의 구성요소를 분리한 자체 변형**이다 (README §4).
# FGD 의 focal 항 = ① GT 전경/배경 마스크 ② teacher attention 가중 ③ attention 강제 L1 인데,
# head 에서의 붕괴 원인이 ①③인지 ②인지 가리기 위해 ②만 남겼다.
# - attention 은 teacher 로만 계산한다 — student attention 을 가중치에 넣으면 안 맞는 곳의
#   자기 attention 을 줄이는 우회가 생긴다. teacher 는 detach 라 가중치가 상수다.
# - ③(γ항)은 넣지 않는다 — 넣는 순간 "가중만 분리한" 실험이 아니게 된다.
# - temp 는 1.0 (distiller.py 의 loss_map 에서 지정). FGD 논문 기본값 0.5 는 head feature 에서
#   채널 가중이 one-hot 으로 퇴화해서(README §4 실측) 완화했다 — FGD 정의에서 한 발 더 벗어난
#   변형이라는 뜻이기도 하다.
#
# 가중치는 공간·채널 각 축에서 평균이 정확히 1이라 mean reduction 관례 안에 있고, attention 이
# 균등하면 일반 MSE 로 환원된다. 실제 teacher feature 실측에서도 MSE 대비 0.95~1.07배였다.

teacher:
  # COCO-pretrained 체크포인트 (repo 루트). 기법 비교는 전부 이 teacher 로 고정된다.
  model: yolov8s.pt
  layers:
    - "model.22.cv2.0.1" # box P3/8
    - "model.22.cv2.1.1" # box P4/16
    - "model.22.cv2.2.1" # box P5/32
    - "model.22.cv3.0.1" # cls P3/8
    - "model.22.cv3.1.1" # cls P4/16
    - "model.22.cv3.2.1" # cls P5/32

student:
  layers:
    - "model.22.cv2.0.1"
    - "model.22.cv2.1.1"
    - "model.22.cv2.2.1"
    - "model.22.cv3.0.1"
    - "model.22.cv3.1.1"
    - "model.22.cv3.2.1"

aligner: ConvBNSiLUAligner # MSE 런과 동일하게 고정 — 가중 방식 하나만 갈린다
loss: amse
# 프로브 실측 (T=0.5 기준): kd_loss 원값이 MSE 의 15배(79.7)다 — 수식상 가중 평균은 1이지만,
# 학습 초기 student 오차가 teacher attention 위치에 몰려 있어(오차-attention 상관) 실효 배율이 크다.
# w=1.0 프로브(amse_w1p0)는 KD 비중 93% 로 task 가 오염되어 FGD 때처럼 두 번 쟀고, 공식 산출은
# 0.0687 이었다. 채택값 0.1 과 T=1.0 완화는 모두 사용자 결정이며 **T=1 에서 재프로브하지 않았다** —
# T 가 낮아지면 가중이 부드러워져 kd_loss 원값이 15배보다 내려가므로, 실효 KD 비중은 ep1 의
# 가중 kd_loss 로그(= 0.1 x 원값)로 확인한다.
weight: 0.1
