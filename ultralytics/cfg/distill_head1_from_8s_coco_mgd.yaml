# KD config — Detect head 2번째 conv 에서 증류. teacher = yolov8s COCO-pretrained. 기법 = MGD.
#
# Phase 3(KD 기법 비교) 3수준 중 하나. distill_head1_from_8s_coco.yaml 에서
# aligner 와 weight 만 다르고 teacher·layers·loss 는 같다.
#
# MGD (https://arxiv.org/abs/2205.01529)는 loss 가 아니다. student feature 의 공간 위치를
# 랜덤하게 가린 뒤, 작은 conv block 이 살아남은 것만으로 teacher feature 를 "생성"하게 만든다.
# 마스킹과 생성 블록에 학습 파라미터가 있어서 aligner 자리에 들어간다 — 참조 구현(mmrazor)도
# MGDConnector(파라미터 있음) + MGDLoss(평범한 MSE)로 쪼개져 있다. 그래서 loss 는 mse 그대로다.
#
# 구조는 MGDConnector 와 동일하다: 채널이 다를 때만 1x1 Conv 투영, 그 뒤 Conv3x3 -> ReLU -> Conv3x3.
# 여기 6지점에서는 box(64->64)에 투영이 없고 cls(64->128)에만 생긴다.
# 참조 구현과 의도적으로 다른 점은 스케일 관례 둘뿐이다 — reduction 을 sum/N 대신 mean 으로 두고,
# alpha_mgd 대신 이 저장소의 weight 를 쓴다 (기존 weight 기준과의 비교를 유지하기 위해서다).
#
# 해석 주의: 이 런은 MSE·PKD 런과 한 축만 다르지 않다. 정렬부(ConvBNSiLU -> 1x1 Conv)·마스킹·
# 생성 블록 셋이 함께 바뀌고, 증류 경로 파라미터가 100,608 -> 1,132,032 (11.3배)가 된다.
# MGD 가 이기면 lambda_mgd: 0.0 런(생성 블록은 두고 마스킹만 끔)으로 마스킹 순효과를 가른다.

teacher:
  # COCO-pretrained 체크포인트 (repo 루트). 기법 3수준이 전부 이 teacher 로 고정된다.
  model: yolov8s.pt
  layers:
    - "model.22.cv2.0.1" # box P3/8
    - "model.22.cv2.1.1" # box P4/16
    - "model.22.cv2.2.1" # box P5/32
    - "model.22.cv3.0.1" # cls P3/8
    - "model.22.cv3.1.1" # cls P4/16
    - "model.22.cv3.2.1" # cls P5/32

student:
  layers:
    - "model.22.cv2.0.1"
    - "model.22.cv2.1.1"
    - "model.22.cv2.2.1"
    - "model.22.cv3.0.1"
    - "model.22.cv3.1.1"
    - "model.22.cv3.2.1"

aligner: MGDAligner
aligner_args:
  lambda_mgd: 0.65 # 가려지는 비율. 0 이면 마스킹이 꺼진다 (통제 런용)
  mask_on_channel: false # 공간 마스킹 (N,1,H,W). true 면 채널 마스킹 (N,C,1,1)
loss: mse # MGD 의 loss 는 평범한 MSE 다 — 기법의 본체는 위 aligner 에 있다
# 1에폭 프로브 실측 (scripts/voc/probe_kd_scale.json): kd_loss mse 5.2608 vs mgd 3.7226.
# 같은 MSE 인데도 낮은 건 생성 블록이 teacher feature 를 직접 맞추도록 학습되기 때문이다.
# 5.2608/3.7226 = 1.41 -> 1.4 (반올림). 보정 후 초기 KD 비중 53.4% (MSE 53.6%).
weight: 1.4
